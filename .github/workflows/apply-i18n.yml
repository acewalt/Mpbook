name: Apply MPBook bilingual UI

on:
  push:
    paths:
      - '.github/workflows/apply-i18n.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Spanish-English language layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./i18n.js?v=1"></script>'
          if tag not in s:
              s = s.replace('</body>', f'{tag}\n</body>')
          p.write_text(s, encoding='utf-8')

          manifest = Path('manifest.webmanifest')
          m = json.loads(manifest.read_text(encoding='utf-8'))
          m['name'] = 'MPBook · Audiolibro / Audiobook'
          m['short_name'] = 'MPBook'
          m['description'] = 'Convierte EPUB, Markdown y TXT en audiolibros / Turn EPUB, Markdown and TXT into audiobooks.'
          manifest.write_text(json.dumps(m, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace('const CACHE = "audiobook-v3";', 'const CACHE = "mpbook-bilingual-v1";')
          text = text.replace('"./manifest.webmanifest", "./icon.svg"]', '"./manifest.webmanifest", "./icon.svg", "./i18n.js?v=1"]')
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Remove installer workflow
        run: rm -f .github/workflows/apply-i18n.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Spanish and English UI with language toggle"
          git push
