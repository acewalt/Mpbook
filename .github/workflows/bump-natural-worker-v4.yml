name: Bump natural voice worker v4
on:
  push:
    paths:
      - '.github/workflows/bump-natural-worker-v4.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump script version
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('./natural-voices.js?v=3', './natural-voices.js?v=4')
          p.write_text(s, encoding='utf-8')
      - name: Remove workflow and commit
        run: |
          rm -f .github/workflows/bump-natural-worker-v4.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html .github/workflows/bump-natural-worker-v4.yml
          git commit -m "Load natural voice worker v4"
          git push