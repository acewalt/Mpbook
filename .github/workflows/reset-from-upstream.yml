name: Reset MPBook from original audiobook repo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reset-from-upstream.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MPBook
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Clone original repository
        run: git clone --depth=1 https://github.com/scandnavik/audiobook.git /tmp/audiobook-original

      - name: Replace repository contents exactly
        shell: bash
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/audiobook-original/ ./

      - name: Commit clean reset
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reset MPBook to scandnavik/audiobook upstream' || exit 0
          git push origin main
