name: Add Hugging Face natural voices

on:
  push:
    paths:
      - '.github/workflows/add-natural-hf-voices.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch MPBook natural voices
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = once(s,
              '          <option value="gemini">Gemini（AI Studio key 直接用，有免費層）</option>\n          <option value="browser">瀏覽器內建（免費，免 key）</option>',
              '          <option value="gemini">Gemini（AI Studio key 直接用，有免費層）</option>\n          <option value="kokoro">自然語音（Hugging Face · Kokoro）</option>\n          <option value="browser">瀏覽器內建（免費，免 key）</option>',
              'provider option')

          s = once(s,
              '            <option value="en">英文</option>\n            <option value="ja">日文</option>',
              '            <option value="en">英文</option>\n            <option value="es">西班牙文</option>\n            <option value="ja">日文</option>',
              'spanish language option')

          s = once(s,
              '      <div id="cloudFields">\n        <div class="field" data-p="openai">',
              '      <div id="cloudFields">\n        <div class="field" data-p="kokoro">\n          <div class="hint">Kokoro 自然語音會在第一次播放時自動從 Hugging Face 載入模型並快取在瀏覽器，不需要安裝語音或 API key。之後會直接使用瀏覽器快取。</div>\n        </div>\n        <div class="field" data-p="openai">',
              'kokoro info block')

          s = once(s,
              '  en: /^en/i,\n  ja: /^ja/i,',
              '  en: /^en/i,\n  es: /^es/i,\n  ja: /^ja/i,',
              'language pattern')

          s = once(s,
              '  if (provider === "gemini") return 4000;\n  if (provider === "browser") return 800;',
              '  if (provider === "gemini") return 4000;\n  if (provider === "kokoro") return 320;\n  if (provider === "browser") return 800;',
              'natural segment length')

          kp = [
              '  kokoro: {',
              '    label: "自然語音（Hugging Face · Kokoro）",',
              '    voices: [',
              '      { id: "natural-auto", label: "Auto · ES / EN", g: "n" },',
              '      { id: "ef_dora", label: "Dora · ES · ♀", g: "f", lang: "es" },',
              '      { id: "em_alex", label: "Alex · ES · ♂", g: "m", lang: "es" },',
              '      { id: "em_santa", label: "Santa · ES · ♂", g: "m", lang: "es" },',
              '      { id: "af_heart", label: "Heart · EN-US · ♀", g: "f", lang: "en" },',
              '      { id: "af_bella", label: "Bella · EN-US · ♀", g: "f", lang: "en" },',
              '      { id: "af_nicole", label: "Nicole · EN-US · ♀", g: "f", lang: "en" },',
              '      { id: "af_sarah", label: "Sarah · EN-US · ♀", g: "f", lang: "en" },',
              '      { id: "am_michael", label: "Michael · EN-US · ♂", g: "m", lang: "en" },',
              '      { id: "am_fenrir", label: "Fenrir · EN-US · ♂", g: "m", lang: "en" },',
              '      { id: "am_puck", label: "Puck · EN-US · ♂", g: "m", lang: "en" },',
              '      { id: "bf_emma", label: "Emma · EN-GB · ♀", g: "f", lang: "en" },',
              '      { id: "bf_isabella", label: "Isabella · EN-GB · ♀", g: "f", lang: "en" },',
              '      { id: "bm_george", label: "George · EN-GB · ♂", g: "m", lang: "en" },',
              '      { id: "bm_fable", label: "Fable · EN-GB · ♂", g: "m", lang: "en" },',
              '    ],',
              '    models: null,',
              '    synth: (t, c) => {',
              '      if (!window.MPBookNatural?.synth) throw new Error("Natural voice runtime is not ready");',
              '      return window.MPBookNatural.synth(t, c);',
              '    },',
              '  },',
          ]
          kokoro_provider = '\n'.join(kp) + '\n'
          s = once(s,
              'const PROVIDERS = {\n  openai: {',
              'const PROVIDERS = {\n' + kokoro_provider + '  openai: {',
              'provider registry')

          s = once(s,
              '    key: provider === "google" ? $("#gKey").value.trim()\n       : provider === "azure"  ? $("#aKey").value.trim()\n       : provider === "gemini" ? $("#gemKey").value.trim()\n       : $("#apiKey").value.trim(),',
              '    key: provider === "kokoro" ? "local"\n       : provider === "google" ? $("#gKey").value.trim()\n       : provider === "azure"  ? $("#aKey").value.trim()\n       : provider === "gemini" ? $("#gemKey").value.trim()\n       : $("#apiKey").value.trim(),',
              'local provider key')

          s = once(s,
              '  let usd = null; // browser 引擎會留 null（呼叫端先擋掉 browser 才會進來）\n  if (perM !== null) usd = newChars / 1e6 * perM;',
              '  let usd = provider === "kokoro" ? 0 : null; // 本機 Hugging Face 模型不收 API 費用\n  if (perM !== null) usd = newChars / 1e6 * perM;',
              'natural export cost')

          s = once(s,
              '  const sizeMB = (provider === "gemini" ? 2.9 : 0.5) * minutes;',
              '  const sizeMB = ((provider === "gemini" || provider === "kokoro") ? 2.9 : 0.5) * minutes;',
              'natural wav estimate')

          s = once(s,
              '  const fmt = cfg.provider === "gemini" ? "WAV（無壓縮，檔較大）" : "MP3";',
              '  const fmt = (cfg.provider === "gemini" || cfg.provider === "kokoro") ? "WAV（無壓縮，檔較大）" : "MP3";',
              'natural export format')

          s = once(s,
              '      if (cfg.provider === "gemini") {\n        const wavs = [];',
              '      if (cfg.provider === "gemini" || cfg.provider === "kokoro") {\n        const wavs = [];',
              'natural wav merge')

          s = once(s,
              '<script src="./i18n.js?v=2"></script>\n</body>',
              '<script src="./i18n.js?v=3"></script>\n<script src="./natural-voices.js?v=1"></script>\n</body>',
              'natural script load')

          p.write_text(s, encoding='utf-8')

          p = Path('i18n.js')
          s = p.read_text(encoding='utf-8')
          s = once(s,
              "    ['瀏覽器內建（免費，免 key）', 'Navegador (gratis, sin key)', 'Browser (free, no key)'],",
              "    ['瀏覽器內建（免費，免 key）', 'Navegador (gratis, sin key)', 'Browser (free, no key)'],\n    ['自然語音（Hugging Face · Kokoro）', 'Voces naturales (Hugging Face · Kokoro)', 'Natural voices (Hugging Face · Kokoro)'],",
              'i18n provider')
          s = once(s,
              "    ['英文', 'Inglés', 'English'],\n    ['日文', 'Japonés', 'Japanese'],",
              "    ['英文', 'Inglés', 'English'],\n    ['西班牙文', 'Español', 'Spanish'],\n    ['日文', 'Japonés', 'Japanese'],",
              'i18n spanish')
          s = once(s,
              "    ['用手機作業系統內建的語音，免費、可離線，但中文自然度視機型而定。', 'Usa las voces integradas del sistema. Es gratis y puede funcionar sin conexión; la calidad depende del dispositivo.', 'Uses built-in system voices. It is free and can work offline; quality depends on the device.'],",
              "    ['用手機作業系統內建的語音，免費、可離線，但中文自然度視機型而定。', 'Usa las voces integradas del sistema. Es gratis y puede funcionar sin conexión; la calidad depende del dispositivo.', 'Uses built-in system voices. It is free and can work offline; quality depends on the device.'],\n    ['Kokoro 自然語音會在第一次播放時自動從 Hugging Face 載入模型並快取在瀏覽器，不需要安裝語音或 API key。之後會直接使用瀏覽器快取。', 'Las voces naturales se cargan automáticamente desde Hugging Face la primera vez y quedan en caché en el navegador. No necesitas instalar voces ni usar una API key. Después se reutiliza la caché local.', 'Natural voices load automatically from Hugging Face the first time and are cached in the browser. No voice installation or API key is required. Later uses reuse the local cache.'],",
              'i18n natural hint')
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = once(s, 'const CACHE = "mpbook-bilingual-v2";', 'const CACHE = "mpbook-natural-v1";', 'service worker cache')
          s = once(s,
              'const ASSETS = ["./", "./index.html", "./manifest.webmanifest", "./icon.svg", "./i18n.js?v=2"];',
              'const ASSETS = ["./", "./index.html", "./manifest.webmanifest", "./icon.svg", "./i18n.js?v=3", "./natural-voices.js?v=1"];',
              'service worker assets')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Remove installer workflow
        run: rm -f .github/workflows/add-natural-hf-voices.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html i18n.js sw.js .github/workflows/add-natural-hf-voices.yml
          git commit -m "Add Hugging Face natural voices as default TTS"
          git push
