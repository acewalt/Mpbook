name: Fix natural voice mobile performance

on:
  push:
    branches:
      - fix/natural-voice-mobile-final6
    paths:
      - '.github/workflows/fix-natural-mobile.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/natural-voice-mobile-final6

      - name: Patch mobile natural voice performance
        shell: python
        run: |
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {n}")
              return text.replace(old, new, 1)

          p = Path('natural-voices.js')
          s = p.read_text(encoding='utf-8')
          s = once(s,
              '  const MAX_CHARS = 300;\n',
              '  const IS_MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);\n  const MAX_CHARS = IS_MOBILE ? 180 : 300;\n',
              'mobile natural chunk')
          s = once(s,
              '          dtype: "q8",\n',
              '          dtype: IS_MOBILE ? "q4" : "q8",\n',
              'mobile q4 model')
          p.write_text(s, encoding='utf-8')

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = once(s,
              '  if (provider === "kokoro") return 320;\n',
              '  if (provider === "kokoro") return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 180 : 300;\n',
              'kokoro auto segment size')
          s = once(s,
              '  const maxLen = fixedSegLen || effSegLen(); // 書庫沿用當時切段長度，續聽段數才對得上\n',
              '  const requestedLen = fixedSegLen || effSegLen();\n  const naturalCap = cfgNow().provider === "kokoro"\n    ? (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 180 : 300)\n    : Infinity;\n  const maxLen = Math.min(requestedLen, naturalCap); // Kokoro 在手機上用較短段落，避免第一次推理等太久\n',
              'natural cap in loadText')
          s = once(s,
              '    if (old && old.lastIndex > 0 && old.lastIndex < State.segments.length) resumeAt = old.lastIndex;\n',
              '    if (old && old.lastIndex > 0) {\n      const oldTotal = Math.max(1, old.total || State.segments.length);\n      resumeAt = Math.min(State.segments.length - 1, Math.max(0, Math.round((old.lastIndex / oldTotal) * State.segments.length)));\n    }\n',
              'resume remap after resegment')
          s = once(s,
              '<script src="./natural-voices.js?v=1"></script>',
              '<script src="./natural-voices.js?v=2"></script>',
              'natural script cache bust')
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          s = once(s,
              'const CACHE = "mpbook-natural-v1";',
              'const CACHE = "mpbook-natural-v2";',
              'service worker cache version')
          s = once(s,
              '"./natural-voices.js?v=1"',
              '"./natural-voices.js?v=2"',
              'service worker natural asset version')
          p.write_text(s, encoding='utf-8')

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-natural-mobile.yml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html natural-voices.js sw.js .github/workflows/fix-natural-mobile.yml
          git commit -m "Optimize natural voice generation on mobile"
          git push origin HEAD:fix/natural-voice-mobile-final6
